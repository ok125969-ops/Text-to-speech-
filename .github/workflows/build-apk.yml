name: Build Android APK (वाणी 100K Hindi TTS)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📦 Install Node Dependencies
        run: |
          npm ci || npm install

      - name: 🌐 Build Web App (Vite React)
        run: |
          npm run build

      - name: 📱 Sync with Capacitor Android
        run: |
          npx cap sync android

      - name: 🔧 Make gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🚀 Build Unsigned Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: 📁 Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          # Copy debug APK
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/Vani-100K-Hindi-TTS-debug.apk
            echo "Copied debug APK"
          fi
          # Copy release APK if built
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/Vani-100K-Hindi-TTS-release-unsigned.apk
            echo "Copied release unsigned APK"
          fi
          ls -la release-apks/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vani-100K-Hindi-TTS-APK
          path: release-apks/*
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*
          name: Release ${{ github.ref_name }}
          body: |
            ## वाणी 100K - Hindi Text to Speech Studio (Android APK)
            - 100,000+ शब्दों का उच्च गुणवत्ता वाला हिंदी वाचन।
            - प्रौढ़ पुरुष (Fenrir) एवं परिपक्व वयस्क महिला (Kore) आवाजें।
            - निरंतर ऑटो-प्ले व मास्टर WAV डाउनलोड सपोर्ट।
            - Download `Vani-100K-Hindi-TTS-debug.apk` to install on your Android device!
          draft: false
          prerelease: false
